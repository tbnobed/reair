services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reair}
      POSTGRES_USER: ${POSTGRES_USER:-reair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reair} -d ${POSTGRES_DB:-reair}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reair}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-reair}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      STORAGE_DIR: /data/uploads
      NODE_ENV: production
      PORT: 5000
    volumes:
      - report_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres_data:
    name: reair_postgres_data
  report_uploads:
    name: reair_report_uploads